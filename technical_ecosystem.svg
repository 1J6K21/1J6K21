    .mono { font-family: "JetBrains Mono", "SF Mono", ui-monospace, monospace; }
    .title { font-size: 10.5px; font-weight: 700; fill: #fca5a5; letter-spacing: 1.5px; }
    .col-title { font-size: 11px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
    .tag-mono { font-size: 9px; font-weight: 700; }
  </style>

  <!-- Container Panel -->
  <rect width="1000" height="290" rx="14" fill="url(#panel-bg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Section Header -->
  <g transform="translate(35, 26)">

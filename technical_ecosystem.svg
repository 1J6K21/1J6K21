<svg fill="none" viewBox="0 0 1000 290" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e131b" />
      <stop offset="100%" stop-color="#06080c" />
    </linearGradient>
    <linearGradient id="cell-bg" x1="0%" y1="0%" x2="100%" y2="100%">
